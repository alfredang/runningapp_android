<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  html,body{width:1080px;height:1920px;overflow:hidden}
  .wrap{width:1080px;height:1920px;background:linear-gradient(160deg,#1C4594 0%,#13316B 100%);display:flex;flex-direction:column;align-items:center;color:#fff}
  .cap{padding:90px 70px 40px;text-align:center}
  .cap h2{font-size:74px;font-weight:800;line-height:1.05;letter-spacing:-1px}
  .cap p{font-size:36px;font-weight:500;margin-top:22px;color:#CFE0FF}
  .phone{margin-top:26px;width:560px;border-radius:54px;background:#0d0f14;padding:16px;box-shadow:0 40px 90px rgba(0,0,0,.45)}
  .phone img{width:100%;display:block;border-radius:40px}
</style></head><body>
  <div class="wrap">
    <div class="cap"><h2>Set your goal.<br>Then just run.</h2><p>Preset 5 / 10 / 20 / 40 km — or any custom distance</p></div>
    <div class="phone"><img src="home.png" alt="Home"></div>
  </div>
</body></html>

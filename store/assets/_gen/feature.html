<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  html,body{width:1024px;height:500px;overflow:hidden}
  .wrap{width:1024px;height:500px;background:linear-gradient(135deg,#1C4594 0%,#163A7D 55%,#0F2A5E 100%);display:flex;align-items:center;padding:0 70px;color:#fff;position:relative}
  .badge{width:150px;height:150px;border-radius:34px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.18)}
  .badge svg{width:96px;height:96px;fill:#fff}
  .txt{margin-left:54px}
  h1{font-size:78px;font-weight:800;letter-spacing:-1px;line-height:1}
  p{font-size:33px;font-weight:500;margin-top:18px;color:#CFE0FF}
  .chips{margin-top:26px;display:flex;gap:14px}
  .chip{font-size:21px;font-weight:600;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
  .glow{position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(94,140,230,.45),transparent 70%)}
</style></head><body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="badge">
      <svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>
    </div>
    <div class="txt">
      <h1>RunTrack GPS</h1>
      <p>Track your run. Reach your goal.</p>
      <div class="chips"><span class="chip">Live GPS route</span><span class="chip">Voice control</span><span class="chip">100% on-device</span></div>
    </div>
  </div>
</body></html>
